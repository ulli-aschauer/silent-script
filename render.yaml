# Render Blueprint: Website + Backend als ein Web Service mit dauerhaftem Datenspeicher.
services:
  - type: web
    name: silent-script
    runtime: node
    plan: starter            # nötig für den Datenspeicher (Disk)
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: silent-script-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATA_DIR
        value: /var/data
      - key: TOKEN_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false          # wird beim Anlegen im Render-Dashboard abgefragt
      - key: SITE_URL
        sync: false          # z.B. https://silent-script.onrender.com, später Ihre Domain
      # E-Mail (optional, später ausfüllen)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: NOTIFY_TO
        sync: false
